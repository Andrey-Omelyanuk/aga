<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Project Selector */
        .project-selector {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }

        .project-selector label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .project-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }

        .project-select:focus {
            outline: none;
            border-color: #2196F3;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #333;
        }

        .agent-select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: background 0.2s;
        }

        .session-item:hover {
            background: #f0f0f0;
        }

        .session-item.active {
            background: #e3f2fd;
        }

        .session-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-meta {
            font-size: 12px;
            color: #999;
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .chat-header h3 {
            font-size: 16px;
            color: #333;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.agent {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: #2196F3;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
        }

        .chat-input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .send-btn {
            padding: 12px 24px;
            background: #2196F3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #1976D2;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .new-session-btn {
            padding: 10px 15px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin: 10px;
        }

        .new-session-btn:hover {
            background: #45a049;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state p {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="project-selector">
        <label for="projectSelect">Проект:</label>
        <select id="projectSelect" class="project-select">
            <option value="">Выберите проект...</option>
        </select>
    </div>

    <div class="main-content">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🤖 Агенты</h2>
            <select id="agentSelect" class="agent-select">
                <option value="">Выберите агента...</option>
            </select>
        </div>
        <button class="new-session-btn" onclick="createNewSession()">+ Новая сессия</button>
        <div id="sessionsList" class="sessions-list"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h3 id="chatTitle">Выберите агента для начала общения</h3>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="empty-state">
                <span style="font-size: 48px;">💬</span>
                <p>Выберите агента и начните диалог</p>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="chatInput" class="chat-input" rows="1" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)"></textarea>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let currentChatId = null;
        let currentAgent = null;
        let chatCache = null;
        let pollTimer = null;

        // === Агенты (роли) ===
        async function loadAgents() {
            try {
                const res = await fetch(`${API_BASE}/roles`);
                const roles = await res.json();
                const select = document.getElementById('agentSelect');
                roles.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role;
                    option.textContent = role;
                    select.appendChild(option);
                });
            } catch (e) {
                console.error('Ошибка загрузки агентов:', e);
            }
        }

        // === Сессии (корневые чаты) ===
        async function loadSessions() {
            try {
                const res = await fetch(`${API_BASE}/chats`);
                const chats = await res.json();
                renderSessions(chats);
                if (chats.length > 0) {
                    loadChat(chats[0].id);
                } else {
                    renderMessages();
                }
            } catch (e) {
                console.error('Ошибка загрузки сессий:', e);
            }
        }

        function renderSessions(chats) {
            const list = document.getElementById('sessionsList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `session-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(chat.id);
                const title = document.createElement('div');
                title.className = 'session-title';
                title.textContent = chat.title || `Чат #${chat.id}`;
                const meta = document.createElement('div');
                meta.className = 'session-meta';
                const d = new Date(chat.updated_at);
                meta.textContent = `${chat.state} • ${d.toLocaleString()}`;
                item.appendChild(title);
                item.appendChild(meta);
                list.appendChild(item);
            });
        }

        async function createNewSession() {
            const res = await fetch(`${API_BASE}/chats`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'Новая сессия' })
            });
            if (res.ok) {
                const chat = await res.json();
                currentChatId = chat.id;
                document.getElementById('chatTitle').textContent = 'Новая сессия';
                renderMessages();
                await loadSessions();
                document.getElementById('chatInput').focus();
            }
        }

        // === Чат ===
        async function loadChat(id) {
            currentChatId = id;
            document.getElementById('chatTitle').textContent = `Чат #${id}`;
            try {
                const res = await fetch(`${API_BASE}/chats/${id}`);
                const data = await res.json();
                chatCache = data;
                renderMessages();
                await loadSessions();
                startPolling();
            } catch (e) {
                console.error('Ошибка загрузки чата:', e);
            }
        }

        async function renderMessages() {
            const container = document.getElementById('chatMessages');
            if (!currentChatId || !chatCache) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size: 48px;">💬</span>
                        <p>Создайте сессию и начните диалог</p>
                    </div>`;
                return;
            }
            container.innerHTML = '';
            for (const msg of chatCache.messages) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message agent`;

                const author = chatCache.participants.find(p => p.id === msg.author_id);
                const name = author ? author.name : `#${msg.author_id}`;

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = msg.body;

                const meta = document.createElement('div');
                meta.className = 'message-meta';
                const d = new Date(msg.created_at);
                meta.textContent = `${name} • ${d.toLocaleTimeString()}` +
                    (msg.share_of_id ? ` • шар №${msg.share_of_id}` : '');

                msgDiv.appendChild(bubble);
                msgDiv.appendChild(meta);

                if (!msg.share_of_id) {
                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'send-btn';
                    shareBtn.style.marginTop = '4px';
                    shareBtn.style.padding = '4px 10px';
                    shareBtn.textContent = '⤴ Шарить';
                    shareBtn.onclick = () => shareMessage(msg.id);
                    msgDiv.appendChild(shareBtn);
                }

                if (msg.share_of_id) {
                    const orig = document.createElement('a');
                    orig.href = '#';
                    orig.textContent = ' → к оригиналу';
                    orig.style.fontSize = '12px';
                    orig.onclick = (e) => { e.preventDefault(); jumpToOriginal(msg.share_of_id); };
                    meta.appendChild(orig);
                }

                container.appendChild(msgDiv);

                // Артефакты
                const artifacts = await fetch(`${API_BASE}/messages/${msg.id}/artifacts`).then(r => r.json()).catch(() => []);
                for (const art of artifacts) {
                    const artDiv = document.createElement('div');
                    artDiv.className = 'message-bubble';
                    artDiv.style.background = '#fff8e1';
                    artDiv.style.border = '1px solid #ffe082';
                    artDiv.textContent = `📎 ${art.title || art.kind}:\n${art.content}`;
                    container.appendChild(artDiv);
                }
            }
            container.scrollTop = container.scrollHeight;
        }

        async function shareMessage(messageId) {
            const target = prompt('ID чата, куда шарить:');
            if (!target || !Number.isInteger(Number(target))) return;
            await fetch(`${API_BASE}/messages/${messageId}/share`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_chat_id: Number(target) })
            });
        }

        function jumpToOriginal(messageId) {
            loadChat(messageId); // сообщение по id == chat? нет; просто сообщаем
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();
            if (!message || !currentChatId) return;
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '...';
            try {
                const res = await fetch(`${API_BASE}/chats/${currentChatId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: message })
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('chatTitle').textContent =
                        data.message.body.substring(0, 50) || 'Новая сессия';
                    if (chatCache) chatCache.messages.push(data.message);
                    renderMessages();
                    loadSessions();
                } else {
                    alert('Не удалось отправить сообщение');
                }
            } catch (e) {
                alert(`Ошибка соединения: ${e.message}`);
            }
            sendBtn.disabled = false;
            sendBtn.textContent = 'Отправить';
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                if (!currentChatId) return;
                try {
                    const res = await fetch(`${API_BASE}/chats/${currentChatId}`);
                    const data = await res.json();
                    if (JSON.stringify(data.messages) !== JSON.stringify(chatCache?.messages)) {
                        chatCache = data;
                        renderMessages();
                    }
                } catch (e) { /* ignore */ }
            }, 2000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Инициализация
        loadAgents();
        loadSessions();
    </script>
</body>
</html>
