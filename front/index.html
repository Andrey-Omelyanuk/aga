<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aga — агенты и воркстейшны</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header .brand { font-weight: 600; color: #333; font-size: 16px; }

        .tabs { display: flex; gap: 4px; }
        .tab {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }
        .tab:hover { background: #f0f0f0; }
        .tab.active { background: #e3f2fd; color: #1565c0; font-weight: 600; }

        main { flex: 1; overflow: auto; }
        .view { display: none; padding: 20px; }
        .view.active { display: block; }

        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .card h4 { font-size: 14px; color: #333; margin-bottom: 4px; }
        .card .meta { font-size: 12px; color: #888; }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            background: #2196F3;
            color: #fff;
        }
        .btn:hover { background: #1976D2; }
        .btn.green { background: #4CAF50; }
        .btn.green:hover { background: #45a049; }
        .btn.gray { background: #eee; color: #333; }
        .btn.gray:hover { background: #ddd; }
        .btn.small { padding: 3px 10px; font-size: 12px; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .form-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
        .form-row input, .form-row select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-row input[type="text"] { flex: 1; }

        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            margin-right: 4px;
        }
        .pill.warn { background: #fff3e0; color: #e65100; }
        .pill.blue { background: #e3f2fd; color: #1565c0; }

        .list-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px; }

        /* Чат */
        .chat-layout { display: flex; height: calc(100vh - 60px); }
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #e0e0e0; }
        .sidebar-header select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .sessions-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
        .session-item:hover { background: #f0f0f0; }
        .session-item.active { background: #e3f2fd; }
        .session-item .t { font-size: 13px; color: #333; }
        .session-item .m { font-size: 11px; color: #999; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 14px 20px; border-bottom: 1px solid #e0e0e0; font-weight: 600; color: #333; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        .chat-input-area { padding: 14px 20px; border-top: 1px solid #e0e0e0; }
        .chat-input-area .row { display: flex; gap: 8px; }
        .chat-input-area textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            min-height: 44px;
        }
        .message { margin-bottom: 12px; }
        .message .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user { display: flex; justify-content: flex-end; }
        .message.user .bubble { background: #2196F3; color: #fff; }
        .message.agent .bubble { background: #f0f0f0; color: #333; }
        .message .meta { font-size: 11px; color: #999; margin-top: 3px; }
        .empty-state { text-align: center; color: #999; padding: 60px 20px; }

        /* Просмотр содержимого проекта (Файлы) */
        .files-layout { display: flex; height: calc(100vh - 60px); }
        .files-sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .files-sidebar .form-row { padding: 14px 16px 0; margin-bottom: 10px; }
        .files-sidebar select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .file-tree { flex: 1; overflow-y: auto; padding: 8px 16px 16px; font-size: 13px; }
        .tree-row { padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
        .tree-row:hover { background: #f0f0f0; }
        .tree-row.dir { font-weight: 600; }
        .tree-child { padding-left: 16px; }
        .file-viewer-container { flex: 1; background: #fff; display: flex; flex-direction: column; }
        .file-path {
            padding: 12px 20px; border-bottom: 1px solid #e0e0e0;
            font-size: 13px; color: #555; font-family: ui-monospace, monospace;
        }
        .file-viewer { flex: 1; overflow: auto; padding: 20px; }
        .file-viewer pre {
            margin: 0; background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 14px; overflow: auto;
        }
        .file-viewer code.hljs { background: #f8f8f8; }
        .file-viewer img, .file-viewer video { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <span class="brand">aga</span>
        <nav class="tabs">
            <button class="tab active" data-view="projects">Проекты</button>
            <button class="tab" data-view="workstations">Воркстейшны</button>
            <button class="tab" data-view="sessions">Сессии</button>
            <button class="tab" data-view="personnel">Персонал</button>
            <button class="tab" data-view="files">Файлы</button>
            <button class="tab" data-view="chat">Чат</button>
        </nav>
        <span style="flex:1"></span>
        <a href="/auth/login" class="btn gray" id="loginBtn" style="text-decoration:none;display:none">Войти через SSO</a>
    </header>

    <main>
        <!-- Проекты -->
        <section class="view active" id="view-projects">
            <div class="form-row">
                <input type="text" id="newProjectUrl" placeholder="git-URL проекта">
                <button class="btn green" onclick="createProject()">Добавить проект</button>
            </div>
            <div id="projectsList"></div>
        </section>

        <!-- Воркстейшны: видно и состояние, управление не предлагается -->
        <section class="view" id="view-workstations">
            <div id="workstationsList"></div>
        </section>

        <!-- Сессии -->
        <section class="view" id="view-sessions">
            <div class="form-row">
                <select id="sessionWorkstation">
                    <option value="">Выберите воркстейшн...</option>
                </select>
                <input type="text" id="newSessionTitle" placeholder="Название сессии" style="flex:1">
                <button class="btn green" onclick="openSession()">Открыть сессию</button>
            </div>
            <div id="sessionsList"></div>
        </section>

        <!-- Персонал: список участников из SSO, правка — вне aga -->
        <section class="view" id="view-personnel">
            <div id="personnelList"></div>
        </section>

        <!-- Содержимое проекта воркстейшна: дерево и просмотр (только чтение) -->
        <section class="view" id="view-files">
            <div class="files-layout">
                <div class="files-sidebar">
                    <div class="form-row">
                        <select id="fileWorkstation">
                            <option value="">Выберите воркстейшн...</option>
                        </select>
                    </div>
                    <div id="fileTree" class="file-tree">
                        <div class="empty-state">Выберите воркстейшн</div>
                    </div>
                </div>
                <div class="file-viewer-container">
                    <div class="file-path" id="filePathLabel">Файл не выбран</div>
                    <div id="fileViewer" class="file-viewer">
                        <div class="empty-state">Откройте папку или файл в дереве</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Чат -->
        <section class="view" id="view-chat">
            <div class="chat-layout">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <select id="agentSelect"><option value="">Выберите агента...</option></select>
                    </div>
                    <button class="btn gray" style="margin:10px" onclick="createNewSession()">+ Новая сессия</button>
                    <div id="sessionsList2" class="sessions-list"></div>
                </div>
                <div class="chat-container">
                    <div class="chat-header" id="chatTitle">Выберите сессию</div>
                    <div id="chatMessages" class="chat-messages">
                        <div class="empty-state">
                            <div style="font-size:40px">💬</div>
                            <p>Выберите сессию или откройте новую</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <div class="row">
                            <textarea id="chatInput" rows="1" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)"></textarea>
                            <button class="btn" onclick="sendMessage()">Отправить</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Ядро (API) — отдельный сервис: в стенде api.localhost, локально localhost:8080.
        const API_BASE = location.hostname === 'dev.localhost' ? 'http://api.localhost' : 'http://localhost:8080';
        let currentChatId = null;
        let currentAgent = null;
        let chatCache = null;
        let pollTimer = null;

        // === SSO: ядро возвращает токен фрагментом URL (#token=...), храним его в
        // localStorage и шлём заголовком Authorization. При 401 — кнопка входа.
        const hashToken = location.hash.match(/^#token=(.+)$/);
        if (hashToken) {
            localStorage.setItem('aga_token', hashToken[1]);
            history.replaceState(null, '', location.pathname + location.search);
        }

        function authHeaders(headers) {
            const token = localStorage.getItem('aga_token');
            const out = Object.assign({}, headers || {});
            if (token) out['Authorization'] = 'Bearer ' + token;
            return out;
        }

        async function api(path, options) {
            options = options || {};
            const res = await fetch(
                `${API_BASE}${path}`,
                Object.assign({}, options, { headers: authHeaders(options.headers) })
            );
            if (res.status === 401) {
                document.getElementById('loginBtn').style.display = 'inline-block';
            }
            return res;
        }

        // === Табы ===
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('view-' + tab.dataset.view).classList.add('active');
                if (tab.dataset.view === 'workstations') loadWorkstations();
                if (tab.dataset.view === 'sessions') { loadSessions(); loadWorkstationSelect(); }
                if (tab.dataset.view === 'personnel') loadPersonnel();
                if (tab.dataset.view === 'projects') loadProjects();
                if (tab.dataset.view === 'files') loadFileWorkstationSelect();
            });
        });

        // === Проекты ===
        async function loadProjects() {
            try {
                const res = await api('/projects');
                if (!res.ok) return;
                const projects = await res.json();
                const list = document.getElementById('projectsList');
                list.innerHTML = '';
                projects.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h4>${escapeHtml(p.git_url)}</h4>
                        <div class="meta">Проект #${p.id}</div>
                        <div style="margin-top:6px">
                            ${(p.agent_set && p.agent_set.agents || []).map(a => `<span class="pill blue">${escapeHtml(a.name)}</span>`).join('')}
                        </div>
                        <div style="margin-top:8px">
                            <button class="btn gray small" onclick="deleteProject(${p.id})">Удалить</button>
                        </div>`;
                    list.appendChild(card);
                });
            } catch (e) { console.error('Проекты:', e); }
        }

        async function createProject() {
            const url = document.getElementById('newProjectUrl').value.trim();
            if (!url) return;
            const res = await api('/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ git_url: url })
            });
            if (res.ok) {
                document.getElementById('newProjectUrl').value = '';
                loadProjects();
            }
        }

        async function deleteProject(id) {
            await api('/projects/' + id, { method: 'DELETE' });
            loadProjects();
        }

        // === Воркстейшны: только просмотр ===
        async function loadWorkstations() {
            try {
                const res = await api('/workstations');
                if (!res.ok) return;
                const workstations = await res.json();
                const list = document.getElementById('workstationsList');
                list.innerHTML = '';
                if (!workstations.length) {
                    list.innerHTML = '<div class="empty-state">Воркстейшнов пока нет</div>';
                    return;
                }
                workstations.forEach(ws => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h4>${escapeHtml(ws.name)} <span class="pill ${ws.state === 'ready' ? '' : 'warn'}">${escapeHtml(ws.state)}</span></h4>
                        <div class="meta">Проект #${ws.project_id}</div>`;
                    list.appendChild(card);
                });
            } catch (e) { console.error('Воркстейшны:', e); }
        }

        // === Сессии ===
        async function loadWorkstationSelect() {
            const select = document.getElementById('sessionWorkstation');
            select.innerHTML = '<option value="">Выберите воркстейшн...</option>';
            try {
                const res = await api('/workstations');
                const workstations = await res.json();
                workstations.forEach(ws => {
                    const option = document.createElement('option');
                    option.value = ws.id;
                    option.textContent = `${ws.name} (${ws.state})`;
                    option.disabled = ws.state !== 'ready';
                    select.appendChild(option);
                });
            } catch (e) { console.error('Выбор воркстейшна:', e); }
        }

        async function openSession() {
            const wsId = document.getElementById('sessionWorkstation').value;
            const title = document.getElementById('newSessionTitle').value.trim();
            if (!wsId) { alert('Выберите готовый воркстейшн'); return; }
            const res = await api('/workstations/' + wsId + '/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title || 'Новая сессия' })
            });
            if (res.ok) {
                document.getElementById('newSessionTitle').value = '';
                loadSessions();
            } else if (res.status === 409) {
                alert('На этом воркстейшне уже открыта сессия');
            } else {
                alert('Не удалось открыть сессию');
            }
        }

        async function loadSessions() {
            try {
                const res = await api('/chats');
                if (!res.ok) return;
                const chats = await res.json();
                renderSessionsList(document.getElementById('sessionsList'), chats);
                renderSessionsList(document.getElementById('sessionsList2'), chats);
            } catch (e) { console.error('Сессии:', e); }
        }

        function renderSessionsList(container, chats) {
            container.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'card';
                const state = chat.state === 'OPEN' ? '' : 'warn';
                item.innerHTML = `
                    <h4>${escapeHtml(chat.title || 'Сессия #' + chat.id)} <span class="pill ${state}">${escapeHtml(chat.state)}</span></h4>
                    <div class="meta">Воркстейшн #${chat.workstation_id ?? '—'} · создана #${chat.created_by_id}</div>
                    <div style="margin-top:6px">
                        <button class="btn gray small" onclick="openChat(${chat.id})">Открыть в чате</button>
                        ${chat.state === 'OPEN' ? `<button class="btn gray small" onclick="closeSession(${chat.id})">Закрыть</button>` : ''}
                    </div>`;
                container.appendChild(item);
            });
        }

        async function closeSession(id) {
            const res = await api('/chats/' + id + '/close', { method: 'POST' });
            if (res.ok) { loadSessions(); } else if (res.status === 403) {
                alert('Закрыть сессию может только тот, кто её открыл');
            }
        }

        function openChat(id) {
            document.querySelector('.tab[data-view="chat"]').click();
            loadChat(id);
        }

        // === Персонал ===
        async function loadPersonnel() {
            try {
                const res = await api('/users');
                if (!res.ok) return;
                const users = await res.json();
                const list = document.getElementById('personnelList');
                list.innerHTML = '';
                users.forEach(u => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h4>${escapeHtml(u.name)} <span class="pill ${u.kind === 'agent' ? 'blue' : ''}">${escapeHtml(u.kind)}</span></h4>
                        <div class="meta">${u.is_super_user ? 'суперпользователь' : 'участник'}</div>`;
                    list.appendChild(card);
                });
            } catch (e) { console.error('Персонал:', e); }
        }

        // === Агенты (из AgentSet-ов) ===
        async function loadAgents() {
            try {
                const res = await api('/agent-sets');
                const sets = await res.json();
                const select = document.getElementById('agentSelect');
                const seen = {};
                sets.forEach(set => {
                    (set.agents || []).forEach(agent => {
                        if (seen[agent.name]) return;
                        seen[agent.name] = true;
                        const option = document.createElement('option');
                        option.value = agent.name;
                        option.textContent = agent.name;
                        select.appendChild(option);
                    });
                });
            } catch (e) { console.error('Агенты:', e); }
        }

        async function createNewSession() {
            const res = await api('/chats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'Новая сессия' })
            });
            if (res.ok) {
                const chat = await res.json();
                currentChatId = chat.id;
                document.getElementById('chatTitle').textContent = 'Новая сессия';
                renderMessages();
                loadSessions();
                document.getElementById('chatInput').focus();
            }
        }

        // === Содержимое проекта воркстейшна (Файлы) ===
        const _langMap = {
            rs: 'rust', py: 'python', js: 'javascript', ts: 'typescript', c: 'c', h: 'c',
            cpp: 'cpp', hpp: 'cpp', java: 'java', go: 'go', rb: 'ruby', php: 'php',
            sh: 'bash', bash: 'bash', html: 'xml', htm: 'xml', css: 'css', scss: 'scss',
            json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'ini', ini: 'ini', xml: 'xml',
            md: 'markdown', markdown: 'markdown', sql: 'sql', dockerfile: 'dockerfile',
            makefile: 'makefile', graphql: 'graphql', proto: 'protobuf', txt: 'plaintext'
        };
        function langFor(path) {
            const ext = (path.split('.').pop() || '').toLowerCase();
            return _langMap[ext] || 'plaintext';
        }

        let currentFileWsId = null;
        let currentFileRevoke = null;

        async function loadFileWorkstationSelect() {
            const select = document.getElementById('fileWorkstation');
            select.innerHTML = '<option value="">Выберите воркстейшн...</option>';
            try {
                const res = await api('/workstations');
                if (!res.ok) return;
                const workstations = await res.json();
                workstations.forEach(ws => {
                    if (ws.state !== 'ready') return;
                    const option = document.createElement('option');
                    option.value = ws.id;
                    option.textContent = `${ws.name} (${ws.state})`;
                    select.appendChild(option);
                });
                if (currentFileWsId) select.value = String(currentFileWsId);
                select.onchange = () => {
                    currentFileWsId = select.value ? Number(select.value) : null;
                    document.getElementById('filePathLabel').textContent = 'Файл не выбран';
                    document.getElementById('fileViewer').innerHTML =
                        '<div class="empty-state">Откройте папку или файл в дереве</div>';
                    loadTree(currentFileWsId, '', document.getElementById('fileTree'));
                };
                loadTree(currentFileWsId, '', document.getElementById('fileTree'));
            } catch (e) { console.error('Файлы: выбор воркстейшна', e); }
        }

        async function loadTree(wsId, rel, container) {
            container.innerHTML = '';
            if (!wsId) {
                container.innerHTML = '<div class="empty-state">Выберите воркстейшн</div>';
                return;
            }
            const path = rel ? `?path=${encodeURIComponent(rel)}` : '';
            try {
                const res = await api('/workstations/' + wsId + '/tree' + path);
                if (!res.ok) return;
                const tree = await res.json();
                if (!tree.entries.length) {
                    container.innerHTML = '<div class="empty-state">Папка пуста</div>';
                    return;
                }
                tree.entries.forEach(entry => renderTreeRow(wsId, entry, container));
            } catch (e) { console.error('Файлы: дерево', e); }
        }

        function renderTreeRow(wsId, entry, container) {
            const row = document.createElement('div');
            row.className = `tree-row ${entry.kind}`;
            const icon = entry.kind === 'dir' ? '📁' : '📄';
            row.textContent = `${icon} ${entry.name}`;
            if (entry.kind === 'dir') {
                const child = document.createElement('div');
                child.className = 'tree-child';
                let loaded = false;
                row.addEventListener('click', () => {
                    if (loaded) {
                        child.style.display = child.style.display === 'none' ? '' : 'none';
                        return;
                    }
                    loaded = true;
                    loadTree(wsId, entry.path, child);
                });
                container.appendChild(row);
                container.appendChild(child);
            } else {
                row.addEventListener('click', () => openFile(wsId, entry));
                container.appendChild(row);
            }
        }

        async function openFile(wsId, entry) {
            document.getElementById('filePathLabel').textContent = '📄 ' + entry.path;
            const viewer = document.getElementById('fileViewer');
            viewer.innerHTML = '<div class="empty-state">Загрузка…</div>';
            if (currentFileRevoke) { URL.revokeObjectURL(currentFileRevoke); currentFileRevoke = null; }
            try {
                const res = await api('/workstations/' + wsId + '/file?path=' + encodeURIComponent(entry.path));
                if (!res.ok) { viewer.innerHTML = '<div class="empty-state">Не удалось прочитать файл</div>'; return; }
                const ct = res.headers.get('content-type') || '';
                if (ct.startsWith('image/')) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob); currentFileRevoke = url;
                    viewer.innerHTML = `<img src="${url}" alt="${entry.name}">`;
                } else if (ct.startsWith('video/')) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob); currentFileRevoke = url;
                    viewer.innerHTML = `<video controls src="${url}"></video>`;
                } else if (ct.startsWith('audio/')) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob); currentFileRevoke = url;
                    viewer.innerHTML = `<audio controls src="${url}"></audio>`;
                } else {
                    // Текст: подсветка синтаксиса по расширению, только чтение.
                    const text = await res.text();
                    viewer.innerHTML = `<pre><code class="hljs"></code></pre>`;
                    const code = viewer.querySelector('code');
                    code.classList.add('language-' + langFor(entry.path));
                    code.textContent = text;
                    if (window.hljs) hljs.highlightElement(code);
                }
            } catch (e) { console.error('Файлы: чтение', e); }
        }

        // === Чат ===
        async function loadChat(id) {
            currentChatId = id;
            document.getElementById('chatTitle').textContent = `Сессия #${id}`;
            try {
                const res = await api('/chats/' + id);
                if (!res.ok) return;
                const data = await res.json();
                chatCache = data;
                renderMessages();
                startPolling();
            } catch (e) { console.error('Чат:', e); }
        }

        async function renderMessages() {
            const container = document.getElementById('chatMessages');
            if (!currentChatId || !chatCache) {
                container.innerHTML = '<div class="empty-state"><p>Выберите сессию</p></div>';
                return;
            }
            container.innerHTML = '';
            for (const msg of chatCache.messages) {
                const author = (chatCache.participants || []).find(p => p.id === msg.author_id);
                const name = author ? author.name : `#${msg.author_id}`;
                const div = document.createElement('div');
                div.className = `message ${msg.author_id === currentChatId ? 'user' : 'agent'}`;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = msg.body;
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = `${name} · ${new Date(msg.created_at).toLocaleTimeString()}` +
                    (msg.share_of_id ? ` · шар №${msg.share_of_id}` : '');
                div.appendChild(bubble);
                div.appendChild(meta);
                container.appendChild(div);
                const artifacts = await api('/messages/' + msg.id + '/artifacts').then(r => r.json()).catch(() => []);
                for (const art of artifacts) {
                    const artDiv = document.createElement('div');
                    artDiv.className = 'message agent';
                    artDiv.innerHTML = `<div class="bubble" style="background:#fff8e1;border:1px solid #ffe082">📎 ${escapeHtml(art.title || art.kind)}:\n${escapeHtml(art.content)}</div>`;
                    container.appendChild(artDiv);
                }
            }
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || !currentChatId) return;
            input.value = '';
            try {
                const res = await api('/chats/' + currentChatId + '/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: message })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (chatCache) chatCache.messages.push(data.message);
                    renderMessages();
                    loadSessions();
                }
            } catch (e) { console.error('Отправка:', e); }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                if (!currentChatId) return;
                try {
                    const res = await api('/chats/' + currentChatId);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (JSON.stringify(data.messages) !== JSON.stringify(chatCache?.messages)) {
                        chatCache = data;
                        renderMessages();
                    }
                } catch (e) { /* ignore */ }
            }, 2000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Инициализация
        document.getElementById('loginBtn').href = API_BASE + '/auth/login';
        loadAgents();
        loadProjects();
    </script>
</body>
</html>
