# Веб-клиент: SPA на history-routing. Любой путь отдаёт index.html,
# чтобы переходы по вкладкам (/projects, /chat/:id, ...) работали
# при прямом открытии URL и обновлении страницы.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}