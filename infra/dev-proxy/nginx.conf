# Шаблон nginx-прокси dev-стенда (compose): *.localhost как в k8s-стенде
# (см. infra/k8s/70-ingress.yaml) — dev.localhost → SPA (front),
# api.localhost → API (core), auth.localhost → Keycloak (SSO). Браузер резолвит
# *.localhost в 127.0.0.1/::1 без /etc/hosts (RFC 6761). Монтируется в сервис
# `proxy` (infra/dev-compose.yml). В compose-сети сервисы доступны по имени:
# front:80, core:8080, keycloak:8080.
events {}

http {
    # dev.localhost и всё остальное — веб-клиент (front, nginx).
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://front;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # api.localhost — API (ядро, core).
    server {
        listen 80;
        server_name api.localhost;

        location / {
            proxy_pass http://core:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # auth.localhost — Keycloak (SSO): authorize_url в dev-roles.yaml.
    # Keycloak запущен с KC_HOSTNAME_STRICT=false — произвольный Host ок.
    server {
        listen 80;
        server_name auth.localhost;

        location / {
            proxy_pass http://keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}