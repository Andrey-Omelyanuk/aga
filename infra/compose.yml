version: "3.8"

services:
  aga:
    build:
      context: ..
      dockerfile: ../Dockerfile
    container_name: aga
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ../config/roles.yaml:/etc/aga/roles.yaml:ro
      - ../data/trace.db:/var/lib/aga/trace.db
      - ../data/work:/var/lib/aga/work
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - AGA_CONFIG_PATH=/etc/aga/roles.yaml
      - AGA_DB_PATH=/var/lib/aga/trace.db
      - AGA_WORK_BASE=/var/lib/aga/work
      - LLM_API_URL=${LLM_API_URL:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
    command: ["./aga"]
    depends_on: []
    networks:
      - aga-net

networks:
  aga-net:
    driver: bridge
