# kubeconfig для kubectl в подах ядра и агент-рантайма: in-cluster API, токен
# своего ServiceAccount'а (tokenFile — kubectl перечитывает его, ротация
# kubelet'а работает), namespace aga в контексте. Секретов в нём нет — токен
# остаётся в projected-томе пода; каждый под ходит со своим SA (aga-core /
# aga-agent, см. 10-rbac.yaml). Монтируется в /etc/aga/kube (KUBECONFIG).
# Токен читает uid 1000: у всех контейнеров пода один runAsUser — kubelet
# отдаёт файл токена этому пользователю (0600).
apiVersion: v1
kind: ConfigMap
metadata:
  name: aga-kubeconfig
  namespace: aga
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: incluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: incluster
        context:
          cluster: incluster
          namespace: aga
          user: sa
    current-context: incluster
    users:
      - name: sa
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
