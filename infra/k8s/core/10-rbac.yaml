apiVersion: v1
kind: ServiceAccount
metadata:
  name: aga-core
  namespace: aga
---
# Минимум для управления воркстейшн-подами: ядро создаёт/удаляет поды
# ws-<id> и делает kubectl exec для команд агента. Secret `aga-ssh` (SSH-ключ
# aga из env) ядро создаёт/обновляет kubectl apply.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aga-core
  namespace: aga
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aga-core
  namespace: aga
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aga-core
subjects:
  - kind: ServiceAccount
    name: aga-core
    namespace: aga