# Centrifugo — реальное время для чата (websocket). Общий канал `common` доступен
# только аутентифицированным: веб-клиент берёт connection-JWT у ядра
# (/connection-jwt/, право на канал в токене), ядро публикует по HTTP API с api_key.
#
# Секреты — из Secret aga-stand (deploy.sh берёт их из .env, генерирует
# make init); те же значения deploy.sh пишет в центрифуго-блок roles.yaml ядра.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  namespace: aga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centrifugo
  template:
    metadata:
      labels:
        app: centrifugo
      annotations:
        # Хеш секретов — подставляет deploy.sh: сменились — под пересоздаётся.
        aga/config-hash: "__CENTRIFUGO_CONFIG_HASH__"
    spec:
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v6
          imagePullPolicy: IfNotPresent
          env:
            # Centrifugo v6 (актуальные сборки): имена env — по путям конфига
            # (client.token_hmac_secret_key, http.api_key, client.allowed_origins,
            # uni_sse.enabled); uni-SSE по умолчанию на /connection/uni_sse —
            # префикс задан /connection/sse, как обращается агент-рантайм
            # (main/src/centrifuge.rs).
            - name: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aga-stand
                  key: centrifugo-secret
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aga-stand
                  key: centrifugo-api-key
            # SPA живёт на dev.localhost (ingress) — это Origin websocket-соединения.
            - name: CENTRIFUGO_CLIENT_ALLOWED_ORIGINS
              value: http://dev.localhost
            # Unidirectional SSE (/connection/sse): транспорт агент-рантайма
            # (`aga agent`, runtime.rs) — серверные подписки на user:<id>
            # и каналы чатов сессий.
            - name: CENTRIFUGO_UNI_SSE_ENABLED
              value: "true"
            - name: CENTRIFUGO_UNI_SSE_HANDLER_PREFIX
              value: /connection/sse
            # v6: каналы с `:` — именованные пространства, объявить обязательно
            # (chat:<id> и user:<id>; общий канал `common` — без namespace).
            - name: CENTRIFUGO_CHANNEL_NAMESPACES
              value: '[{"name":"chat"},{"name":"user"}]'
            - name: CENTRIFUGO_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5