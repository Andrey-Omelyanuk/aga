# Агент-рантайм — отдельный процесс того же образа (`/app/aga agent`): подписан
# на Centrifugo, реагирует на сообщения привязанных пользователей (runtime.rs).
# HTTP не раздаёт — чат обслуживает aga-core. Общая БД: тот же PVC aga-data
# (SQLite WAL, RWO) — поэтому под рантайма живёт на узле ядра (podAffinity).
# Команды агентов идут в поды воркстейшнов через kubectl exec — свой SA
# aga-agent: только exec, без создания/удаления подов и секретов.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aga-agent
  namespace: aga
spec:
  replicas: 1
  # Один процесс рантайма на БД: старый под гасится до старта нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aga-agent
  template:
    metadata:
      labels:
        app: aga-agent
      annotations:
        # Хеш конфигов и секретов — подставляет deploy.sh (см. 30-deployment-core).
        aga/config-hash: "__CORE_CONFIG_HASH__"
    spec:
      serviceAccountName: aga-agent
      securityContext:
        # Один runAsUser на под — токен SA читается uid 1000 (tokenFile).
        runAsUser: 1000
        runAsGroup: 65534
        fsGroup: 1000
      affinity:
        # RWO-том с SQLite монтируется на одном узле: рантайм — рядом с ядром.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: aga-core
              topologyKey: kubernetes.io/hostname
      containers:
        - name: agent
          # Тег :latest заменяет deploy.sh на тег сборки (git sha).
          image: aga-core:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/aga", "agent"]
          envFrom:
            # SSH-ключ aga нужен рантайму так же, как ядру: git+ssh в воркстейшнах.
            - secretRef:
                name: aga-ssh-env
          env:
            - name: AGA_CONFIG_PATH
              value: /etc/aga/roles.yaml
            - name: AGA_DB_PATH
              value: /var/lib/aga/trace.db
            - name: AGA_K8S_NAMESPACE
              value: aga
            - name: AGA_K8S_IMAGE
              value: aga-workstation:latest
            - name: AGA_K8S_KUBECTL
              value: kubectl
            # kubeconfig из ConfigMap aga-kubeconfig: токен SA aga-agent.
            - name: KUBECONFIG
              value: /etc/aga/kube/kubeconfig
            # Heartbeat рантайма: mtime файла обновляется каждые 10 с, пока жив
            # цикл; livenessProbe ниже читает тот же путь.
            - name: AGA_HEARTBEAT_FILE
              value: /tmp/aga-agent.alive
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: RUST_LOG
            - name: AGA_MAX_THREAD_DEPTH
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: AGA_MAX_THREAD_DEPTH
            - name: AGA_MAX_THREAD_MESSAGES
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: AGA_MAX_THREAD_MESSAGES
          # HTTP нет — живость по heartbeat-файлу: обновлялся не дольше 60 с назад.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/aga-agent.alive) )) -lt 60
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 65534
          volumeMounts:
            - name: roles
              mountPath: /etc/aga/roles.yaml
              subPath: roles.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/aga
            - name: kubeconfig
              mountPath: /etc/aga/kube
              readOnly: true
      volumes:
        - name: roles
          secret:
            secretName: aga-roles
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: aga-data
        - name: kubeconfig
          configMap:
            name: aga-kubeconfig
