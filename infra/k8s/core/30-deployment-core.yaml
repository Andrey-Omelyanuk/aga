apiVersion: apps/v1
kind: Deployment
metadata:
  name: aga-core
  namespace: aga
spec:
  replicas: 1
  # SQLite на RWO PVC (общая с aga-agent): два пода ядра одновременно писать в
  # неё не должны — старый под гасится до старта нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aga-core
  template:
    metadata:
      labels:
        app: aga-core
      annotations:
        # Хеш конфигов и секретов (roles.yaml, aga-env, SSH-ключ, конфиг
        # Keycloak) — подставляет deploy.sh: сменились — под пересоздаётся
        # (roles.yaml ядро читает при старте, JWKS — после рестарта Keycloak).
        aga/config-hash: "__CORE_CONFIG_HASH__"
    spec:
      serviceAccountName: aga-core
      securityContext:
        # USER aga (uid 1000) из образа; fsGroup даёт запись в PVC. Один
        # runAsUser на все контейнеры пода — kubelet отдаёт токен SA этому uid
        # (kubeconfig ниже читает его через tokenFile).
        runAsUser: 1000
        runAsGroup: 65534
        fsGroup: 1000
      initContainers:
        # Ядро при старте тянет JWKS из Keycloak; если Keycloak ещё не готов —
        # работает без SSO. Поэтому ждём realm, пока Keycloak не ответит.
        - name: wait-keycloak
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - until wget -q -O /dev/null http://keycloak:8080/realms/aga; do sleep 2; done
      containers:
        - name: aga
          # Тег :latest заменяет deploy.sh на тег сборки (git sha).
          image: aga-core:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/aga"]
          envFrom:
            # SSH-ключ aga (AGA_SSH_PRIVATE_KEY) — Secret aga-ssh-env, создаёт
            # deploy.sh из .env (пусто, если ключ не задан).
            - secretRef:
                name: aga-ssh-env
          env:
            - name: AGA_CONFIG_PATH
              value: /etc/aga/roles.yaml
            - name: AGA_DB_PATH
              value: /var/lib/aga/trace.db
            - name: AGA_K8S_NAMESPACE
              value: aga
            # Образ воркстейшн-подов (шаблон рендерит ядро); тег — как у ядра.
            - name: AGA_K8S_IMAGE
              value: aga-workstation:latest
            - name: AGA_K8S_KUBECTL
              value: kubectl
            # kubeconfig из ConfigMap aga-kubeconfig (15-kubeconfig.yaml): токен
            # SA aga-core через tokenFile, namespace aga.
            - name: KUBECONFIG
              value: /etc/aga/kube/kubeconfig
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: RUST_LOG
            - name: AGA_MAX_THREAD_DEPTH
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: AGA_MAX_THREAD_DEPTH
            - name: AGA_MAX_THREAD_MESSAGES
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: AGA_MAX_THREAD_MESSAGES
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: PORT
            - name: AGA_FRONT_URL
              valueFrom:
                configMapKeyRef:
                  name: aga-env
                  key: AGA_FRONT_URL
          ports:
            - name: http
              containerPort: 8080
          # /healthz — публичный, без авторизации. Старт ждёт JWKS Keycloak
          # (ретраи) — startupProbe даёт до ~5 мин, liveness включается после.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 65534
          volumeMounts:
            # roles.yaml с секретами (Centrifugo, клиент Keycloak) — из Secret
            # aga-roles (deploy.sh), не из ConfigMap.
            - name: roles
              mountPath: /etc/aga/roles.yaml
              subPath: roles.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/aga
            - name: kubeconfig
              mountPath: /etc/aga/kube
              readOnly: true
      volumes:
        - name: roles
          secret:
            secretName: aga-roles
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: aga-data
        - name: kubeconfig
          configMap:
            name: aga-kubeconfig
