# Шаблон локального nginx-прокси для *.localhost без `minikube tunnel`.
# Проксирует 80 на ingress-nginx по nodePort, сохраняя Host — дальше
# маршрутизирует ingress (dev/api/auth.localhost). Заполняется скриптом
# local-proxy.sh: __MINIKUBE_IP__ и __INGRESS_NODE_PORT__ подставляются из кластера.
# Слушает только loopback (127.0.0.1 и ::1 — куда браузер резолвит *.localhost):
# контейнер в --network host, иначе стенд был бы виден из LAN.
events {}

http {
    server {
        listen 127.0.0.1:80 default_server;
        listen [::1]:80 default_server;
        server_name _;

        location / {
            proxy_pass http://__MINIKUBE_IP__:__INGRESS_NODE_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}