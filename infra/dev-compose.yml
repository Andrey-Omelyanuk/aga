# Dev-стенд (docker compose): ядро + веб-клиент + Keycloak + 2 воркстейшна,
# без кластера. Единственный способ поднять *стенд* — k8s (make k8s-*); этот
# compose — только для локальной разработки и отладки многопоточности
# воркстейшнов. SSO включён, как в k8s-стенде: вход через Keycloak
# (auth.localhost), API и UI требуют токен.
#
# Управление — make dev-up / dev-down / dev-logs / dev-ps /
# dev-reset / dev-verify. Воркстейшны (ws-1, ws-2) поднимаются заранее и
# переиспользуются ядром (AGA_WS_BACKEND=docker): POST /workstations находит
# существующий контейнер ws-<id> и не пересоздаёт его.
#
# Проекты воркстейшнов — пустые git-репо в отдельных named volumes
# (ws-1-data/ws-2-data, без доступа с хоста); GIT_URL не задан, entrypoint
# инициализирует пустое репо сам. Проект агент наполняет сам в dev.
#
# Секреты (ключи Centrifugo, секрет клиента и пароль админа Keycloak) — из .env:
# их генерирует make init; без них compose не стартует. Порты публикуются
# только на loopback (127.0.0.1) — стенд не виден из LAN.
# AGA_DEV_URL_PORT — порт в публичных адресах *.localhost: пусто при
# AGA_PROXY_PORT=80 (браузер пишет адрес без «:80»), иначе `:<порт>`; задаёт
# makefile. Из него собираются origin фронта, redirect_uri и KC_HOSTNAME —
# Keycloak сверяет их строкой.
name: aga-dev

services:
  core:
    image: aga-core:dev
    build:
      context: ../main
      dockerfile: Dockerfile
    container_name: aga-core
    # Воркстейшны управляются через docker.sock хоста; образ ядра запускается
    # пользователем aga (uid 1000) — для dev переходим на root.
    user: "0:0"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      # Конфиг ядра со включённым SSO (dev-roles.yaml), указывающим на Keycloak
      # этого compose. Генерируется из main/config/roles.yaml — make dev-roles
      # (вызывается из dev-up).
      - ./dev-roles.yaml:/etc/aga/roles.yaml:ro
      - aga-data:/var/lib/aga
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - PORT=${PORT:-8080}
      - AGA_CONFIG_PATH=/etc/aga/roles.yaml
      - AGA_DB_PATH=/var/lib/aga/trace.db
      # Воркстейшны как docker-контейнеры (не поды): переиспользуем ws-1/ws-2
      # из compose, при необходимости создаём через docker run.
      - AGA_WS_BACKEND=docker
      # Образ воркстейшна: тот же, что собирает compose (server ниже).
      - AGA_K8S_IMAGE=aga-workstation:dev
      - AGA_MAX_THREAD_DEPTH=${AGA_MAX_THREAD_DEPTH:-10}
      - AGA_MAX_THREAD_MESSAGES=${AGA_MAX_THREAD_MESSAGES:-100}
      # SSH-ключ aga (git+ssh для воркстейшнов): приватный задаёт админ в .env;
      # ядро прокидывает его в контейнеры ws (inject_ssh_key) при подъёме.
      - AGA_SSH_PRIVATE_KEY=${AGA_SSH_PRIVATE_KEY:-}
      # Канонический адрес SPA dev-стенда — через прокси (dev.localhost),
      # туда же возвращается токен после SSO (auth_callback) и уводит выход
      # (post_logout_redirect_uri). Задаём явно, а не из .env: там
      # AGA_FRONT_URL=http://localhost:8081 (для make run), что ломает возврат
      # токена в SSO-флоу dev-стенда. Совпадает с AGA_KC_FRONT_URL Keycloak.
      - AGA_FRONT_URL=http://dev.localhost${AGA_DEV_URL_PORT:-}
    restart: "no"

  # Агент-рантайм — отдельный процесс того же образа (`aga agent`): подписан на
  # общий канал Centrifugo (SSE), отвечает за пользователей, к которым привязаны
  # агенты, когда их спрашивают (@имя, нить, ответ на вопрос; runtime.rs).
  # HTTP не раздаёт — чат обслуживает core. Общая БД (тот же aga-data, SQLite WAL),
  # команды агентов идут в контейнеры ws через docker.sock (AGA_WS_BACKEND=docker).
  # Centrifugo обязателен: без него рантайм не поднимается (нет источника событий).
  agent:
    image: aga-core:dev
    container_name: aga-agent
    command: ["agent"]
    user: "0:0"
    volumes:
      - ./dev-roles.yaml:/etc/aga/roles.yaml:ro
      - aga-data:/var/lib/aga
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - AGA_CONFIG_PATH=/etc/aga/roles.yaml
      - AGA_DB_PATH=/var/lib/aga/trace.db
      - AGA_WS_BACKEND=docker
      - AGA_K8S_IMAGE=aga-workstation:dev
      - AGA_MAX_THREAD_DEPTH=${AGA_MAX_THREAD_DEPTH:-10}
      - AGA_MAX_THREAD_MESSAGES=${AGA_MAX_THREAD_MESSAGES:-100}
      - AGA_SSH_PRIVATE_KEY=${AGA_SSH_PRIVATE_KEY:-}
    depends_on:
      - core
      - centrifugo
    restart: "no"

  # Маленькая LLM для dev — только проверить, что цикл запускается, интеллект
  # не важен (модель до 1B). Модель тянется при старте, чтобы агенты работали
  # из коробки после make dev-up. Подключение к ней ядро не создаёт само: LLM
  # настраивается в БД — сидом (make dev-seed, адрес ollama:11434/v1) или
  # вручную на странице «LLM».
  ollama:
    image: ollama/ollama:latest
    container_name: aga-ollama
    # Entrypoint образа — ollama, поэтому явно задаём shell: поднимаем сервер и
    # тянем маленькую модель (после первого раза pull — no-op, volume хранит).
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3 && ollama pull qwen3:0.6b && wait"]
    volumes:
      - ollama-data:/root/.ollama
    restart: "no"

  # Keycloak — SSO dev-стенда (тот же realm, что в k8s: aga, участники
  # alice/bob). Вход через auth.localhost (прокси → keycloak:8080), JWKS/token
  # ядро тянет по имени сервиса (keycloak:8080) из compose-сети.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aga-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Админ master-realm (создаётся при первом старте; пароль — из .env).
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${AGA_KC_ADMIN_PASSWORD:?run make init (stand secrets in .env)}
      - KC_HTTP_PORT=8080
      # Издатель токенов — всегда публичный адрес (браузер ходит через
      # auth.localhost), а ядро обращается по keycloak:8080. Без фиксированного
      # hostname Keycloak отклоняет refresh из ядра: «Invalid token issuer»
      # (тихое обновление токена в SPA не работало). Пойман e2e (access.spec.ts).
      - KC_HOSTNAME=http://auth.localhost${AGA_DEV_URL_PORT:-}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      # Плейсхолдеры realm (keycloak-realm.json, подставляются при импорте):
      # секрет клиента aga, адрес ядра (redirect_uri — <api>/auth/callback) и
      # origin фронта (post_logout_redirect_uri). Без переменной Keycloak
      # оставил бы строку `${...}` как есть — поэтому `:?`.
      - AGA_KC_CLIENT_SECRET=${AGA_KC_CLIENT_SECRET:?run make init (stand secrets in .env)}
      - AGA_KC_API_URL=http://api.localhost${AGA_DEV_URL_PORT:-}
      - AGA_KC_FRONT_URL=http://dev.localhost${AGA_DEV_URL_PORT:-}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./k8s/core/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    restart: "no"

  front:
      # Веб-клиент в dev — vite dev-server с HMR: исходники монтируются из
      # ../front (node_modules хоста, образ node:22 — glibc, esbuild работает).
      # Правки подхватываются без пересборки образа; прод-сборка (nginx, dist/)
      # остаётся отдельной: make build + k8s/front.
      image: node:22
      container_name: aga-front
      working_dir: /app
      command: npm run dev -- --host 0.0.0.0 --port 80 --strictPort
      volumes:
        - ../front:/app
      # Браузер открывает его на host-порту 8081 и ходит на ядро напрямую
      # (localhost:8080), как при локальном make run-front; прокси ходит на front:80.
      ports:
        - "127.0.0.1:${AGA_FRONT_PORT:-8081}:80"
      restart: "no"

  # Centrifugo — реальное время для чата (websocket). Общий канал `common`
  # доступен только аутентифицированным: веб-клиент берёт connection-JWT у ядра
  # (/connection-jwt/, право на канал в токене), ядро публикует по HTTP API с
  # api_key. Секреты — из .env (make init), те же попадают в центрифуго-блок
  # dev-roles.yaml (make dev-roles).
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: aga-centrifugo
    environment:
      # Centrifugo v6: имена env — по путям конфига (client.token_hmac_secret_key,
      # http.api_key, client.allowed_origins, uni_sse.enabled), uni-SSE по
      # умолчанию живёт на /connection/uni_sse — префикс задан тем же
      # /connection/sse, как обращается агент-рантайм (centrifuge.rs).
      - CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=${AGA_CENTRIFUGO_SECRET:?run make init (stand secrets in .env)}
      - CENTRIFUGO_HTTP_API_KEY=${AGA_CENTRIFUGO_API_KEY:?run make init (stand secrets in .env)}
      # SPA живёт на dev.localhost (прокси) — это и есть Origin websocket-соединения.
      - CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=http://dev.localhost${AGA_DEV_URL_PORT:-}
      # Unidirectional SSE (/connection/sse): им пользуется агент-рантайм
      # (`aga agent`) для серверной подписки на общий канал (runtime.rs).
      - CENTRIFUGO_UNI_SSE_ENABLED=true
      - CENTRIFUGO_UNI_SSE_HANDLER_PREFIX=/connection/sse
      # v6: каналы с `:` — именованные пространства, их надо объявить
      # (chat:<id> и user:<id> публикуют ядро и рантайм, общий `common` — без него).
      - CENTRIFUGO_CHANNEL_NAMESPACES=[{"name":"chat"},{"name":"user"}]
      - CENTRIFUGO_LOG_LEVEL=info
    restart: "no"

  # Прокси *.localhost как в k8s-стенде: dev.localhost → front (SPA),
  # api.localhost → core (API). Браузер сам резолвит *.localhost в
  # 127.0.0.1/::1 (RFC 6761), порт 80 — как в стенде. Конфиг: dev-proxy/nginx.conf.
  proxy:
    image: nginx:alpine
    container_name: aga-proxy
    depends_on:
      - core
      - front
    ports:
      - "127.0.0.1:${AGA_PROXY_PORT:-80}:80"
    volumes:
      - ./dev-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: "no"

  ws-1:
    image: aga-workstation:dev
    build: ./k8s/workstation-image
    container_name: ws-1
    # Rootful DinD (dockerd внутри работает root'ом); команды агента ядро
    # выполняет через `docker exec -u 1000`, поэтому файлы проекта в volume
    # принадлежат uid 1000. Проект в отдельном named volume (не bind-mount) —
    # на хосте файлов воркстейшнов нет. Docker-демон воркстейшна изолирован
    # в собственном контейнере — ws-1 и ws-2 не конфликтуют. privileged —
    # ради DinD: это не граница изоляции, контейнер с ним близок к root хоста
    # (см. «Изоляция воркстейшна» в infra/AGENTS.md).
    privileged: true
    volumes:
      - ws-1-data:/work/project
    environment:
      - BRANCH=ws-1
    restart: "no"

  ws-2:
    image: aga-workstation:dev
    build: ./k8s/workstation-image
    container_name: ws-2
    privileged: true
    volumes:
      - ws-2-data:/work/project
    environment:
      - BRANCH=ws-2
    restart: "no"

volumes:
  aga-data:
  ws-1-data:
  ws-2-data:
  ollama-data:
