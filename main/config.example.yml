# Пример runtime-конфига для локального запуска.
# Копируется в config/roles.yaml через `make init`.
# Агентов больше не задают глобальные роли — их определяет AgentSet проекта
# (см. /agent-sets), который живёт в БД и настраивается через API.
#
# Блоки до `sso:` попадают в dev-roles.yaml и стендовый roles.yaml
# (infra/stand-roles.sh); centrifuge- и sso-блоки там стендовые — с секретами
# из .env (AGA_CENTRIFUGO_*, AGA_KC_CLIENT_SECRET; генерирует make init).

# Centrifugo (опционально). Реальное время для чата: общий канал для всех
# аутентифицированных. Не задан — чат без автообновления (/connection-jwt/ — 404).
# Здесь — только для локального запуска (make run / run-agent) рядом со своим
# Centrifugo: api_key и secret должны совпадать с его конфигом. Литералы ниже —
# заглушки, не секреты стенда.
centrifuge:
  api_url: http://centrifugo:8000
  api_key: change-me-api-key
  secret: change-me-hmac-secret
  channel: common

# SSO (опционально). Выключен — все запросы под аноним-суперпользователем.
# Включён — API принимает Bearer-токены Keycloak: подпись проверяется по
# JWKS, роли берутся из realm-ролей (participant / admin).
sso:
  enabled: false
  jwks_url: null          # https://keycloak/realms/<realm>/protocol/openid-connect/certs
  authorize_url: null     # .../protocol/openid-connect/auth  (для /auth/login)
  token_url: null         # .../protocol/openid-connect/token (для /auth/callback и /auth/refresh)
  end_session_url: null   # .../protocol/openid-connect/logout (для /auth/logout)
  client_id: null
  client_secret: null