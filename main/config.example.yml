# Пример runtime-конфига для локального запуска.
# Копируется в config/roles.yaml через `make init`.
# Пресеты ролей — в roles/; можно ссылаться на них или переопределять.
roles:
  app-deployer:
    prompt: |
      Ты — деплоер приложений. Поднимай новые сервисы через docker-compose.
    allowed_commands: ["docker-compose", "docker", "echo"]
    max_iterations: 3
    llm:
      model: "qwen3.5:9b"
      temperature: 0.7
  docker-helper:
    prompt: |
      Ты — ассистент по Docker. Управляй контейнерами и сервисами.
      Разрешённые: docker, docker-compose, echo.
      Перед перезапуском сервисов спрашивай подтверждение.
    allowed_commands: ["docker", "docker-compose", "echo"]
    max_iterations: 3
    llm:
      model: "qwen3.5:9b"
      temperature: 0.7

# SSO (опционально). Выключен — все запросы под аноним-суперпользователем.
# Включён — API принимает Bearer-токены Keycloak: подпись проверяется по
# JWKS, роли берутся из realm-ролей (participant / admin).
sso:
  enabled: false
  jwks_url: null          # https://keycloak/realms/<realm>/protocol/openid-connect/certs
  authorize_url: null     # .../protocol/openid-connect/auth  (для /auth/login)
  token_url: null         # .../protocol/openid-connect/token (для /auth/callback)
  client_id: null
  client_secret: null
